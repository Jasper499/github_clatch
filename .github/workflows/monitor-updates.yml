name: Monitor Content Updates

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      recovery_grace_minutes:
        description: Recovery delay (external scheduler uses 0; alerts always allow 90 minutes)
        type: choice
        options: ["90", "0"]
        default: "90"
  workflow_run:
    workflows:
      - Twice-Daily Hacker News Update
      - Every 6 Hours Weibo Update
      - Daily China Daily Update
      - Daily Nature Skills Update
      - Daily Scientific Agent Skills Update
      - Weekly Content Update
      - Biweekly MRI Journal Update
    types: [completed]

concurrency:
  group: content-update-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Detect overdue snapshots and recover
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/monitor_updates.cjs').run({ github, context, core });
