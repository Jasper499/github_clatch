name: Daily Scientific Agent Skills Update

on:
  schedule:
    # UTC 02:40 and 14:40 (Beijing 10:40 and 22:40)
    - cron: "40 2,14 * * *"
  workflow_dispatch:

concurrency:
  group: data-content-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update-scientific-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch scientific-agent-skills
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_scientific_agent_skills.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta.json data/sources/ data/readmes/ data/history/ data/manifest.json data/feeds/ data/search/ data/scientific-agent-skills-notify.json
          bash scripts/git_push_with_retry.sh "chore: daily scientific-agent-skills update" changed

      - name: Notify via GitHub Issue
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          notify = json.loads(Path("data/scientific-agent-skills-notify.json").read_text(encoding="utf-8"))
          if not notify.get("changed"):
              print("Notify skipped: content SHA unchanged")
              raise SystemExit(0)
          latest = notify.get("latestCommit") or {}
          lines = [
              "## Scientific Agent Skills has updates",
              "",
              f"- Repo: [{notify.get('repo')}]({notify.get('repoUrl')})",
              f"- Stars: {notify.get('stars')}",
              f"- Skills: {notify.get('skillCount')}",
              f"- Latest commit: [`{latest.get('sha')}`]({latest.get('url')}) {latest.get('title')}",
              f"- Site: {notify.get('siteUrl')}",
              "",
              "### Recent commits",
              "",
          ]
          for c in notify.get("recentCommits") or []:
              lines.append(f"- [`{c.get('sha')}`]({c.get('url')}) {c.get('title')}")
          lines.extend([
              "",
              "---",
              "_This issue is auto-created by GitHub Actions when `K-Dense-AI/scientific-agent-skills` updates._",
          ])
          Path("/tmp/scientific-agent-skills-notify.md").write_text("\n".join(lines), encoding="utf-8")
          print("Notification body prepared.")
          PY
          # Python exit 0 on skip does not stop the shell; only create an issue when body exists.
          if [ ! -f /tmp/scientific-agent-skills-notify.md ]; then
            echo "No notification body; skipping issue create."
            exit 0
          fi
          TITLE="Scientific Agent Skills update $(date -u +%Y-%m-%d)"
          gh issue create \
            --title "$TITLE" \
            --body-file /tmp/scientific-agent-skills-notify.md \
            --label "scientific-skills-notify" || \
          gh issue create \
            --title "$TITLE" \
            --body-file /tmp/scientific-agent-skills-notify.md || \
          echo "Issue notify failed (non-blocking)."
